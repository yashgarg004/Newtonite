services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ops_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build: ./api
    command: sh -c "npm run migrate:deploy && npm run seed"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ops_dev
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    command: npm run start
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ops_dev
      JWT_SECRET: docker-compose-dev-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 24h
      PORT: "3000"
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./api
    command: npm run start:worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ops_dev
      JWT_SECRET: docker-compose-dev-secret-at-least-32-characters-long
      NODE_ENV: development
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
